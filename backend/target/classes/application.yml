spring:
  application:
    name: greenops-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/greenops
    username: greenops_user
    password: greenops_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:noreply@greenops.local}
    password: ${SMTP_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

greenops:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  apis:
    pagespeed-key: ${PAGESPEED_API_KEY:}
    electricity-maps-key: ${ELECTRICITY_MAPS_API_KEY:}
