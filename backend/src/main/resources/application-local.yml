spring:
  datasource:
    url: jdbc:h2:mem:greenops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

greenops:
  apis:
    pagespeed-key: ${PAGESPEED_API_KEY:}
    electricity-maps-key: ${ELECTRICITY_MAPS_API_KEY:}